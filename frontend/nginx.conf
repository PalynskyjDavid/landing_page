worker_processes 2;
worker_shutdown_timeout 10s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Private diagnostic access logs: no query strings, headers, cookies or bodies.
    map $uri $logged_path { "~^(?<short_log_path>.{0,160})" $short_log_path; }
    map $uri $metric_route {
        default "<unmatched>";
        /api/scores /scores;
        /api/scores/leaderboard /scores/leaderboard;
        /api/scores/statistics /scores/statistics;
    }
    map $request_method $metric_method { default OTHER; GET GET; POST POST; }
    map $uri $collect_request {
        default 0;
        /api/system/statistics 0;
        /api/health 0;
        /api/health/live 0;
        /api/health/ready 0;
        ~^/api(?:/|$) 1;
    }
    log_format private_request escape=json
        '{"event":"edge_request","time":"$time_iso8601","request_id":"$request_id",'
        '"peer":"$remote_addr","method":"$request_method","path":"$logged_path",'
        '"status":$status,"seconds":$request_time}';
    log_format metric_event escape=json
        '{"v":1,"route":"$metric_route","method":"$metric_method",'
        '"status":"$status","seconds":"$request_time"}';
    access_log /dev/stdout private_request;
    # UDP never waits for PostgreSQL. Private logs remain available if collection fails.
    access_log syslog:server=127.0.0.1:5514,tag=metrics,nohostname metric_event if=$collect_request;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Use the connection address, never caller-supplied forwarding headers.
    # Production must expose ONLY this edge, not the direct Go debugging port.
    map "$request_method:$uri" $score_write_key {
        default "";
        "POST:/api/scores" $binary_remote_addr;
    }
    limit_req_zone $binary_remote_addr zone=api_requests:10m rate=5r/s;
    limit_req_zone $score_write_key zone=score_writes:10m rate=12r/m;
    limit_req_status 429;
    map $status $retry_after {
        default "";
        429 "5";
    }

    # Docker's embedded DNS. Re-resolve after API replacement, without restarting web.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream go_api {
        zone go_api 64k;
        server api:3001 resolve;
    }

    map $uri $cache_control {
        default "no-cache";
        ~^/api(?:/|$) "no-store";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 8k;
        client_body_timeout 10s;

        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        add_header Retry-After $retry_after always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # Web health deliberately does not depend on the API/DB being available.
        location = /healthz { default_type text/plain; return 200 "ok\n"; }

        location = /api { return 404; }
        location ^~ /api/ {
            limit_req zone=api_requests burst=20 nodelay;
            limit_req zone=score_writes burst=12 nodelay;
            # The trailing slash strips /api/: /api/scores becomes Go's /scores.
            proxy_pass http://go_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            # The domain-specific frontend outbox owns retries, especially POSTs.
            proxy_next_upstream off;
            proxy_intercept_errors off;
            error_page 502 503 504 = @api_unavailable;
            error_page 429 = @api_rate_limited;
            error_page 413 = @api_body_too_large;
        }
        location @api_rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Your queued scores will retry after the cooldown."}}';
        }
        location @api_body_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"request_too_large","message":"Score requests must not exceed 8 KiB."}}';
        }
        location @api_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"api_unavailable","message":"The API is temporarily unavailable."}}';
        }

        # Docs and development tooling are deliberately not published.
        location = /docs { return 404; }
        location ^~ /docs/ { return 404; }
        location ^~ /@vite/ { return 404; }
        location ^~ /src/ { return 404; }
        location ^~ /node_modules/ { return 404; }
        location ~ /\. { return 404; }

        location ^~ /assets/ { try_files $uri =404; }
        location ~* \.(js|css|map|json|yaml|yml)$ { try_files $uri =404; }
        # React Router handles page routes, including direct loads of /game.
        location / { try_files $uri $uri/ /index.html; }
    }
}
