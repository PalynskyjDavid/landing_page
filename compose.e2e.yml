# Only the E2E tooling uses this project. No development containers or volumes.
name: landing-page-e2e

services:
  db:
    image: postgres:16
    labels:
      landing-page.e2e: "true"
    environment:
      POSTGRES_DB: reaction_e2e
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_password
    ports:
      - "127.0.0.1:5547:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      # Initialization briefly runs a socket-only server; wait for the real TCP server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U e2e_user -d reaction_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  data:
    labels:
      landing-page.e2e: "true"
