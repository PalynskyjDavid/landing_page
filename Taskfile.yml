version: "3"

vars:
  BACKEND_DIR: my-backend
  BACKEND_TOOLS_DIR: my-backend/tools
  FRONTEND_DIR: frontend

tasks:
  default:
    desc: Run the complete read-only quality check
    cmds:
      - task: check

  check:
    desc: Run formatting checks, linters, tests, and production builds
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: build

  format:
    desc: Rewrite backend and frontend files using their formatters
    cmds:
      - task: backend:format
      - task: frontend:format

  format:check:
    desc: Report formatting differences without rewriting files
    cmds:
      - task: backend:format:check
      - task: frontend:format:check

  lint:
    desc: Run backend and frontend static analysis
    cmds:
      - task: backend:lint
      - task: frontend:lint

  test:
    desc: Run the current automated test suites
    cmds:
      - task: backend:test
      - task: frontend:test

  build:
    desc: Build the backend and frontend
    cmds:
      - task: backend:build
      - task: frontend:build

  db:setup:
    desc: Start PostgreSQL, wait until it is healthy, and apply all migrations
    cmds:
      - task: db:up
      - task: db:migrate

  test:db:setup:
    desc: Start isolated E2E PostgreSQL, migrate it, and RESET its data to the baseline
    cmds:
      - node frontend/scripts/test-db.js setup

  test:db:up:
    desc: Start or resume E2E PostgreSQL without resetting data
    cmds:
      - node frontend/scripts/test-db.js up

  test:db:reset:
    desc: RESET only E2E data to baseline.sql; keep the migrated schema
    cmds:
      - node frontend/scripts/test-db.js reset

  test:db:stop:
    desc: Stop E2E PostgreSQL while preserving its test data
    cmds:
      - node frontend/scripts/test-db.js stop

  test:db:down:
    desc: Remove the isolated E2E container and DELETE its disposable test volume
    cmds:
      - node frontend/scripts/test-db.js down

  test:db:status:
    desc: Show the isolated E2E PostgreSQL container
    cmds:
      - node frontend/scripts/test-db.js status

  test:db:logs:
    desc: Show recent isolated E2E PostgreSQL logs
    cmds:
      - node frontend/scripts/test-db.js logs

  test:e2e:install:
    desc: "Install locked Chromium (run npm ci first); Linux CI: -- --with-deps"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - node node_modules/@playwright/test/cli.js install chromium {{.CLI_ARGS}}

  test:e2e:
    desc: "Run isolated browser tests; options: KEEP_TEST_DB=true and -- --headed or --ui"
    env:
      KEEP_TEST_DB: '{{.KEEP_TEST_DB | default "false"}}'
    cmds:
      - node frontend/scripts/test-e2e.js {{.CLI_ARGS}}

  db:up:
    desc: Start only the local PostgreSQL service and wait until it is healthy
    dotenv: [".env"]
    cmds:
      - docker compose up -d --wait db

  db:stop:
    desc: Stop PostgreSQL without deleting its data volume
    dotenv: [".env"]
    cmds:
      - docker compose stop db

  db:status:
    desc: Show the local PostgreSQL container status
    dotenv: [".env"]
    cmds:
      - docker compose ps db

  db:logs:
    desc: Show the latest PostgreSQL container logs
    dotenv: [".env"]
    cmds:
      - docker compose logs db --tail 100

  db:migrate:
    desc: Apply pending PostgreSQL migrations with the pinned Tern version
    dotenv: [".env"]
    cmds:
      - go -C "{{.BACKEND_TOOLS_DIR}}" tool tern migrate --config ../tern.conf --migrations ../migrations

  db:migration:status:
    desc: Show applied and pending PostgreSQL migrations
    dotenv: [".env"]
    cmds:
      - go -C "{{.BACKEND_TOOLS_DIR}}" tool tern status --config ../tern.conf --migrations ../migrations

  db:migration:new:
    desc: "Create the next migration (usage: task db:migration:new NAME=add_leaderboard_identity)"
    requires:
      vars: [NAME]
    cmds:
      - go -C "{{.BACKEND_TOOLS_DIR}}" tool tern new --migrations ../migrations "{{.NAME}}"

  backend:format:
    desc: Rewrite Go files using configured formatters
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - golangci-lint fmt

  backend:format:check:
    desc: Fail if Go formatting differs without rewriting files
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - golangci-lint fmt --diff

  backend:lint:
    desc: Run Go static analysis, including formatter checks
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - golangci-lint run --build-tags=integration

  backend:test:
    desc: Run all Go tests
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go test ./...

  backend:build:
    desc: Compile the Go API without writing a repository binary
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - go build -buildvcs=false ./...

  backend:test:integration:
    desc: Test score name migrations and retries in an isolated PostgreSQL test schema
    dotenv: [".env"]
    cmds:
      - go -C "{{.BACKEND_DIR}}" test -tags=integration -count=1 -v ./internal/games/reaction/results

  frontend:format:
    desc: Rewrite frontend files with Prettier
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run format

  frontend:format:check:
    desc: Check frontend formatting with Prettier
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run format:check

  frontend:lint:
    desc: Run ESLint with warnings treated as failures
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run lint

  frontend:test:
    desc: Run frontend unit tests once
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run test

  frontend:build:
    desc: Create the Vite production build
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run build
