# Production only. Never use the disposable test DB/reset scripts against this project.
name: landing-page-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    mode: non-blocking
    max-buffer-size: "1m"

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  stop_grace_period: 20s
  logging: *logging

services:
  edge:
    <<: *runtime
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks:
      edge:
        ipv4_address: 172.30.46.2
    depends_on:
      web: {condition: service_healthy}

  web:
    <<: *runtime
    image: landing-page-web:${RELEASE:?Use the production script to select a Git commit}
    build: {context: ./frontend}
    volumes:
      - ./deploy/nginx-proxy-trust.conf:/etc/nginx/proxy-trust.conf:ro
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks: [edge, backend]
    depends_on:
      api: {condition: service_healthy}

  api:
    <<: *runtime
    image: landing-page-api:${RELEASE:?Set RELEASE}
    build: {context: ./my-backend, target: api}
    environment:
      DATABASE_URL: postgresql://app_api:${API_PASSWORD:?Set API_PASSWORD}@db:5432/reaction?sslmode=disable
      BACKEND_PORT: "3001"
      COOKIE_SECURE: "true"
      CORS_ORIGIN: ""
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}

  collector:
    <<: *runtime
    image: landing-page-collector:${RELEASE:?Set RELEASE}
    build: {context: ./my-backend, target: collector}
    environment:
      DATABASE_URL: postgresql://app_collector:${COLLECTOR_PASSWORD:?Set COLLECTOR_PASSWORD}@db:5432/reaction?sslmode=disable
    # Keep the UDP listener on web's loopback, not a public port/Docker socket.
    network_mode: service:web
    mem_limit: 128m
    depends_on:
      web: {condition: service_healthy}

  db:
    image: &postgres postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_DB: reaction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD}
      API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD}
      COLLECTOR_PASSWORD: ${COLLECTOR_PASSWORD:?Set COLLECTOR_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [backend]
    shm_size: 128mb
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d reaction"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *runtime
    restart: "no"
    image: landing-page-migrate:${RELEASE:?Set RELEASE}
    build: {context: ./my-backend, target: migrate}
    environment:
      DATABASE_URL: postgresql://app_migrator:${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD}@db:5432/reaction?sslmode=disable
    networks: [backend]
    profiles: [tools]

  restore-check:
    # No network, host ports, or durable storage: restore ONLY into this scratch DB.
    image: *postgres
    profiles: [tools]
    network_mode: none
    restart: "no"
    environment:
      POSTGRES_DB: reaction
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: ["/var/lib/postgresql/data:size=1g"]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d reaction"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  edge:
    ipam:
      # Keep automatic addresses away from Caddy's reserved .2 address, including
      # when web starts before Caddy during the first deployment.
      config: [{subnet: 172.30.46.0/24, ip_range: 172.30.46.128/25}]
  backend:
    internal: true

volumes:
  database:
  certificates:
  caddy_config:
