# Only Caddy has this address on the dedicated edge network. Do not expose web
# directly or enable a CDN proxy without revisiting this trust boundary.
set_real_ip_from 172.30.46.2;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
map "$realip_remote_addr:$http_x_forwarded_proto" $origin_scheme {
    default $scheme;
    "172.30.46.2:https" https;
}
