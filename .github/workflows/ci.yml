name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# CI reads code but cannot push commits, publish packages, or deploy anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, lint, unit tests, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from the backend module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: my-backend/go.mod
          cache-dependency-path: |
            my-backend/go.sum
            my-backend/tools/go.sum

      - name: Set up Node.js from the local version file
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      - name: Install the same Go linter used locally
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          install-only: true
          working-directory: my-backend

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Run the shared local quality gate
        run: task check

  postgres:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Disposable credentials for this job's database only; no project secrets.
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/reaction_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reaction_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d reaction_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from the backend module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: my-backend/go.mod
          cache-dependency-path: |
            my-backend/go.sum
            my-backend/tools/go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      - name: Migrate the empty database
        run: task db:migrate

      - name: Verify a second migration run is a no-op
        run: task db:migrate

      - name: Show the resulting schema version
        run: task db:migration:status

      - name: Run real PostgreSQL integration tests
        run: task backend:test:integration

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from the backend module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: my-backend/go.mod
          cache-dependency-path: |
            my-backend/go.sum
            my-backend/tools/go.sum

      - name: Set up Node.js from the local version file
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium and Linux browser dependencies
        run: task test:e2e:install -- --with-deps

      # Compose, migrations, API/frontend startup, and cleanup use the local wrapper.
      # This job has its own database, separate from the postgres job's service.
      - name: Run the four full-stack scenarios
        run: task test:e2e KEEP_TEST_DB=false

      - name: Upload Playwright report and failure evidence
        if: ${{ !cancelled() }} # Upload after test failures too, but not cancelled runs.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: warn # Setup failures may happen before reports exist.
