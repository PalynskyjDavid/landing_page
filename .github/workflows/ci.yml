name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# CI reads code but cannot push commits, publish packages, or deploy anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, lint, unit tests, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from the backend module
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: my-backend/go.mod
          cache-dependency-path: |
            my-backend/go.sum
            my-backend/tools/go.sum

      - name: Set up Node.js from the local version file
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: 3.53.1

      - name: Install the same Go linter used locally
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          install-only: true
          working-directory: my-backend

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Run the shared local quality gate
        run: task check

  postgres:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Disposable credentials for this job's database only; no project secrets.
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/reaction_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reaction_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d reaction_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from the backend module
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: my-backend/go.mod
          cache-dependency-path: |
            my-backend/go.sum
            my-backend/tools/go.sum

      - name: Install Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: 3.53.1

      - name: Migrate the empty database
        run: task db:migrate

      - name: Verify a second migration run is a no-op
        run: task db:migrate

      - name: Show the resulting schema version
        run: task db:migration:status

      - name: Run real PostgreSQL integration tests
        run: task backend:test:integration
