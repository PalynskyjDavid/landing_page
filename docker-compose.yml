services:
  db:
    image: postgres:16
    container_name: events_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5454}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  backend:
    profiles: ["legacy"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: events_backend
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://eventsuser:eventspass@db:5432/eventsdb}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db

  backend-go-api:
    build:
      context: ./backend-go
      dockerfile: Dockerfile.dev
    container_name: events_backend_go_api
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://eventsuser:eventspass@db:5432/eventsdb}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      STATS_UPDATE_INTERVAL_SECONDS: ${STATS_UPDATE_INTERVAL_SECONDS:-60}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-10}
    ports:
      - "${BACKEND_PORT:-3001}:${API_PORT:-3000}"
    command: ["go", "run", "./cmd/api"]
    volumes:
      - ./backend-go:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      - db

  backend-go-worker:
    build:
      context: ./backend-go
      dockerfile: Dockerfile.dev
    container_name: events_backend_go_worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://eventsuser:eventspass@db:5432/eventsdb}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      STATS_UPDATE_INTERVAL_SECONDS: ${STATS_UPDATE_INTERVAL_SECONDS:-60}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-10}
    command: ["go", "run", "./cmd/worker"]
    volumes:
      - ./backend-go:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: events_frontend
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-go-api

volumes:
  pgdata:
  go_mod_cache:
